<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DashNovel User Guide</title>
<script>
  (function () {
    var langs = ['ko', 'en', 'ja', 'zh-Hant', 'zh-Hans', 'es', 'pt-BR', 'de', 'fr', 'it', 'id', 'vi'];
    function norm(code) {
      code = (code || '').toLowerCase();
      if (code.indexOf('zh') === 0) return /hant|tw|hk|mo/.test(code) ? 'zh-Hant' : 'zh-Hans';
      if (code.indexOf('pt') === 0) return 'pt-BR';
      var first = code.split(/[-_]/)[0];
      return langs.indexOf(first) >= 0 ? first : null;
    }
    // 차례: ?lang= → 옛 주소의 #<언어>-… → 지난번 고른 언어 → 브라우저 언어 → 영어
    var query = (location.search.match(/[?&]lang=([^&#]+)/) || [])[1];
    var hash = location.hash.slice(1), fromHash = null;
    langs.forEach(function (l) { if (hash.indexOf(l + '-') === 0) fromHash = l; });
    var pick = norm(query) || fromHash;
    if (!pick) { try { var saved = localStorage.getItem('guideLang'); if (langs.indexOf(saved) >= 0) pick = saved; } catch (e) {} }
    if (!pick) { var list = navigator.languages || [navigator.language]; for (var i = 0; i < list.length && !pick; i++) pick = norm(list[i]); }
    location.replace('guide-' + (pick || 'en') + '.html' + location.hash);
  })();
</script>
<style>
  body { font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 40px auto; max-width: 480px; padding: 0 16px; }
  @media (prefers-color-scheme: dark) { body { background: #131313; color: #f0f0f0; } a { color: #5b9bf0; } }
</style>
</head>
